[package]
name = "sqi-hunt"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
reqwest = { version = "0.13.4", features = ["blocking", "cookies"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json  = "1"
regex       = "1"
colored     = "2"
indicatif   = "0.17"
anyhow      = "1"
url         = "2"
scraper     = "0.21"
figlet-rs = "1.0.0"

